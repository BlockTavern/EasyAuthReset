name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download EasyAuth API jar (compile-time only)
        run: |
          mkdir -p libs
          curl -L -o libs/easyauth-mc1.21-3.4.4.jar \
            https://cdn.modrinth.com/data/aZj58GfX/versions/bga5lUKd/easyauth-mc1.21-3.4.4.jar

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyauthreset
          path: build/libs/easyauthreset-*.jar
