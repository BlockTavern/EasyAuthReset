name: Release

# 打 v 开头标签（如 v1.0.0）时自动构建并发布 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史以生成对比上一版本的更新日志

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download EasyAuth API jar (compile-time only)
        run: |
          mkdir -p libs
          curl -L -o libs/easyauth-mc1.21-3.4.4.jar \
            https://cdn.modrinth.com/data/aZj58GfX/versions/bga5lUKd/easyauth-mc1.21-3.4.4.jar

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Verify tag matches mod_version
        run: |
          v=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          t=${GITHUB_REF_NAME#v}
          echo "mod_version=$v tag=$t"
          if [ "$v" != "$t" ]; then
            echo "::warning::Tag v$t does not match mod_version $v in gradle.properties (release jar will still be built)"
          fi

      - name: Generate release notes (from CHANGELOG.md, bilingual; fallback to git log)
        id: notes
        run: |
          SECTION=$(awk -v t="## ${GITHUB_REF_NAME}" '
            index($0, t) == 1 {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            PREV=$(git tag --sort=-creatordate | sed -n 2p)
            if [ -n "$PREV" ]; then
              SECTION=$(git log --pretty=format:'- %s' "$PREV".."$GITHUB_REF_NAME")
            else
              SECTION=$(git log --pretty=format:'- %s' -n 30 HEAD)
            fi
          fi
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SECTION" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Keep only the mod jar (drop sources jar from release assets)
        run: rm -f build/libs/*-sources.jar build/libs/*-dev*.jar

      - name: Publish GitHub Release (mod jar only)
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/easyauthreset-*.jar
          name: EasyAuthReset ${{ github.ref_name }}
          body: |
            ## 更新内容 / Changelog

            ${{ steps.notes.outputs.changes }}

            ## 说明 / About

            - 目标环境 / Target：Fabric 1.21 / 1.21.1（纯服务端 / server-side only）
            - 依赖 / Depends：Fabric API、EasyAuth ≥ 3.3.5（推荐 3.4.4）
            - 用法 / Usage：把 `easyauthreset-*.jar` 放入服务器 `mods/`；启动后按 `config/easyauthreset.json` 的 `_说明` 配置 SMTP。Put the jar into the server's `mods/` folder and follow the `_说明` hints in the generated config to set up SMTP.
            - 完整说明 / Docs：README.md
