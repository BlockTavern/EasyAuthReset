// Loom 必须 >= EasyAuth 3.4.4 发布 jar 构建时所用的 Loom (1.14.10)，否则报
// "Mod was built with a newer version of Loom"。
// 通过 buildscript classpath 应用（而非 plugins {} 标记），
// 以避免 Gradle 对插件标记 org.gradle.plugin.api-version 的版本匹配限制。
buildscript {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.17.19'
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // fabric-loader / yarn / fabric-api 等
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    // javax.mail / javax.activation 来自 Maven Central
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // EasyAuth 3.4.1+（面向 MC 1.21 / 1.21.1）。
    // 源码: https://github.com/NikitaCartes/EasyAuth  |  3.4.4 下载:
    // https://cdn.modrinth.com/data/aZj58GfX/versions/bga5lUKd/easyauth-mc1.21-3.4.4.jar
    // 运行时由服务器 mods 文件夹中的 easyauth 提供；这里仅用于编译期 API 检查。
    modImplementation files("libs/easyauth-mc1.21-3.4.4.jar")

    // JavaMail 及其 activation 依赖：
    //  - implementation：编译期 + 开发运行时可见
    //  - include：打进最终 jar，否则生产环境（mods 文件夹）会出现 NoClassDefFoundError
    implementation "com.sun.mail:javax.mail:1.6.2"
    implementation "com.sun.activation:javax.activation:1.2.0"
    include "com.sun.mail:javax.mail:1.6.2"
    include "com.sun.activation:javax.activation:1.2.0"

    // 仅开发模式（runServer）：EasyAuth 的嵌套 jar（sqlite-jdbc）在 loom 开发类路径上不会自动解出，
    // 补一个让 dev 服务器能连上 EasyAuth 默认的 SQLite 数据库。不会打进产物 jar，生产可忽略。
    runtimeOnly "org.xerial:sqlite-jdbc:3.49.1.0"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
